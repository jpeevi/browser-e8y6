<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>%TITLE%</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: "DejaVu Sans Mono", monospace;
            background: #303030;
            color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 540px;
            margin-top: -6vh;
            text-align: center;
        }

        h1 {
            margin: 0 0 36px;
            font-size: clamp(48px, 10vw, 76px);
            font-weight: 600;
            letter-spacing: -4px;
            line-height: 1.2;
        }

        .private {
            margin-bottom: 24px;
            font-size: 13px;
            color: #dddddd;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px;
            border: 1px solid #606060;
            border-radius: 12px;
            background: #404040;
        }

        .search:focus-within {
            border-color: #999999;
        }

        .search input {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font: inherit;
            font-size: 14px;
        }

        .search input::placeholder {
            color: #aaaaaa;
        }

        .search button {
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #606060;
            color: white;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .search button:hover {
            background: #737373;
        }

        .footer {
            margin-top: 34px;
            color: #aaaaaa;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            main {
                margin-top: 0;
            }

            h1 {
                margin-bottom: 28px;
            }

            .search button {
                padding: 11px;
            }
        }


        .brand-logo {
            display: block;
            width: min(280px, 75vw);
            height: auto;
            object-fit: contain;
            margin: 0 auto 36px;
        }

    </style>
</head>

<body>
<main>

    <img
            alt="browser:e8y6"
            class="brand-logo"
            src="%BROWSER-LOGO%"
    >


    <div class="private">%PRIVATE-BROWSING%</div>

    <!-- Temporary search until native integration is added -->
    <form
            action="https://duckduckgo.com/"
            class="search"
            method="GET"
    >
        <input
                aria-label="Search the web"
                autocomplete="off"
                autofocus
                id="search-input"
                name="q"
                placeholder="Search the web"
                required
                type="search"
        >

        <button type="submit">
            Search
        </button>
    </form>

    <div class="footer">
        browser:e8y6
    </div>
</main>
</body>
</html>
